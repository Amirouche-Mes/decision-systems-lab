[project]
name = "dsl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amirouche.Mesrour", email = "amirouche.mesrour@isatis-canada.com" }
]
requires-python = ">=3.12"
dependencies = [
    "category-encoders>=2.10.0",
    "fastapi[standard]>=0.141.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=2.10.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "protobuf>=3.20.0,<5.0.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "setuptools>=84.0.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
decision-systems-lab = "decision_systems_lab:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsl"]
